<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Student MS</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Inter", "Segoe UI", sans-serif;
        background: linear-gradient(
          135deg,
          #0f0f23 0%,
          #1a1a3e 50%,
          #0d1b2a 100%
        );
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .login-container {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(0, 255, 200, 0.1);
        border-radius: 24px;
        padding: 50px;
        width: 100%;
        max-width: 420px;
        box-shadow:
          0 25px 50px rgba(0, 0, 0, 0.5),
          0 0 100px rgba(0, 255, 200, 0.05);
      }
      .logo {
        text-align: center;
        margin-bottom: 40px;
      }
      .logo h1 {
        font-size: 2em;
        background: linear-gradient(135deg, #00ffc8 0%, #00b4d8 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 8px;
      }
      .logo p {
        color: #6b7280;
        font-size: 14px;
      }
      .form-group {
        margin-bottom: 24px;
      }
      .form-group label {
        display: block;
        color: #94a3b8;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 8px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .form-group input {
        width: 100%;
        padding: 16px 20px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        color: #fff;
        font-size: 15px;
        transition: all 0.3s;
      }
      .form-group input:focus {
        outline: none;
        border-color: #00ffc8;
        box-shadow: 0 0 20px rgba(0, 255, 200, 0.2);
      }
      .form-group input::placeholder {
        color: #475569;
      }
      .btn-login {
        width: 100%;
        padding: 16px;
        background: linear-gradient(135deg, #00ffc8 0%, #00b4d8 100%);
        border: none;
        border-radius: 12px;
        color: #0f0f23;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.3s;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .btn-login:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 30px rgba(0, 255, 200, 0.3);
      }
      .error {
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.3);
        color: #f87171;
        padding: 12px 16px;
        border-radius: 10px;
        margin-bottom: 20px;
        font-size: 14px;
        display: none;
      }
      .quick-login {
        margin-top: 30px;
        padding-top: 30px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
      }
      .quick-login p {
        color: #6b7280;
        font-size: 12px;
        text-align: center;
        margin-bottom: 15px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .quick-btns {
        display: flex;
        gap: 10px;
      }
      .quick-btn {
        flex: 1;
        padding: 12px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.03);
        border-radius: 10px;
        color: #fff;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
      }
      .quick-btn:hover {
        background: rgba(0, 255, 200, 0.1);
        border-color: rgba(0, 255, 200, 0.3);
      }
      .quick-btn.admin {
        border-left: 3px solid #f43f5e;
      }
      .quick-btn.teacher {
        border-left: 3px solid #f59e0b;
      }
      .quick-btn.student {
        border-left: 3px solid #10b981;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="logo">
        <h1>🎓 Student MS</h1>
        <p>Student Management System</p>
      </div>
      <div class="error" id="error"></div>
      <form id="loginForm">
        <div class="form-group">
          <label>Username</label
          ><input
            type="text"
            id="username"
            placeholder="Enter your username"
            required
          />
        </div>
        <div class="form-group">
          <label>Password</label
          ><input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
          />
        </div>
        <button type="submit" class="btn-login">Sign In</button>
      </form>
      <div class="quick-login">
        <p>Quick Demo Access</p>
        <div class="quick-btns">
          <button
            class="quick-btn admin"
            onclick="quickLogin('admin', 'admin123')"
          >
            Admin
          </button>
          <button
            class="quick-btn teacher"
            onclick="quickLogin('teacher1', 'admin123')"
          >
            Teacher
          </button>
          <button
            class="quick-btn student"
            onclick="quickLogin('student1', 'admin123')"
          >
            Student
          </button>
        </div>
      </div>
    </div>
    <script>
      document
        .getElementById("loginForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          await doLogin(
            document.getElementById("username").value,
            document.getElementById("password").value,
          );
        });
      function quickLogin(u, p) {
        document.getElementById("username").value = u;
        document.getElementById("password").value = p;
        doLogin(u, p);
      }
      async function doLogin(username, password) {
        const errEl = document.getElementById("error");
        errEl.style.display = "none";
        try {
          const res = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password }),
          });
          const data = await res.json();
          if (res.ok && data.token) {
            localStorage.setItem("token", data.token);
            localStorage.setItem("user", JSON.stringify(data));
            window.location.href = "/dashboard.html";
          } else {
            errEl.textContent = data.message || "Invalid credentials";
            errEl.style.display = "block";
          }
        } catch (err) {
          errEl.textContent = "Connection error";
          errEl.style.display = "block";
        }
      }
    </script>
  </body>
</html>
