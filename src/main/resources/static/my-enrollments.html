<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Enrollments - Student MS</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Inter", "Segoe UI", sans-serif;
        background: #0f0f23;
        min-height: 100vh;
        color: #e2e8f0;
      }
      .navbar {
        background: linear-gradient(90deg, #1a1a3e 0%, #0d1b2a 100%);
        padding: 16px 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid rgba(0, 255, 200, 0.1);
      }
      .navbar h1 {
        font-size: 1.4em;
        background: linear-gradient(135deg, #00ffc8, #00b4d8);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        cursor: pointer;
      }
      .navbar .user-info {
        display: flex;
        align-items: center;
        gap: 15px;
      }
      .role-badge {
        padding: 6px 14px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        background: linear-gradient(135deg, #10b981, #059669);
        color: #fff;
      }
      .logout-btn {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: #fff;
        padding: 8px 18px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        transition: all 0.3s;
      }
      .logout-btn:hover {
        background: rgba(239, 68, 68, 0.2);
        border-color: #f43f5e;
      }
      .container {
        display: flex;
        min-height: calc(100vh - 65px);
      }
      .sidebar {
        width: 240px;
        background: #1a1a3e;
        padding: 25px 0;
        border-right: 1px solid rgba(0, 255, 200, 0.1);
      }
      .sidebar a {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 25px;
        color: #94a3b8;
        text-decoration: none;
        transition: all 0.3s;
        font-size: 14px;
      }
      .sidebar a:hover,
      .sidebar a.active {
        background: rgba(0, 255, 200, 0.05);
        color: #00ffc8;
        border-right: 3px solid #00ffc8;
      }
      .sidebar .section {
        padding: 20px 25px 10px;
        color: #475569;
        font-size: 11px;
        text-transform: uppercase;
        font-weight: 700;
        letter-spacing: 1px;
      }
      .main {
        flex: 1;
        padding: 30px;
      }
      .page-header {
        margin-bottom: 25px;
      }
      .page-header h2 {
        color: #00ffc8;
        font-size: 1.5em;
        margin-bottom: 5px;
      }
      .page-header p {
        color: #64748b;
      }
      .card {
        background: #1a1a3e;
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 16px;
        overflow: hidden;
      }
      .card-header {
        padding: 20px 25px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }
      .card-header h3 {
        color: #e2e8f0;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        padding: 16px 20px;
        text-align: left;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }
      th {
        background: rgba(0, 0, 0, 0.2);
        color: #94a3b8;
        font-weight: 600;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      tr:hover {
        background: rgba(0, 255, 200, 0.02);
      }
      .btn {
        padding: 10px 18px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        font-size: 13px;
        transition: all 0.3s;
      }
      .btn-danger {
        background: linear-gradient(135deg, #f43f5e, #e11d48);
        color: #fff;
      }
      .btn-sm {
        padding: 6px 12px;
        font-size: 12px;
      }
      .status-badge {
        padding: 4px 10px;
        border-radius: 12px;
        font-size: 11px;
        font-weight: 600;
      }
      .status-enrolled {
        background: rgba(16, 185, 129, 0.2);
        color: #10b981;
      }
      .toast {
        position: fixed;
        bottom: 20px;
        right: 20px;
        padding: 16px 24px;
        border-radius: 10px;
        color: #fff;
        font-weight: 600;
        z-index: 2000;
      }
      .toast.success {
        background: linear-gradient(135deg, #10b981, #059669);
      }
      .toast.error {
        background: linear-gradient(135deg, #f43f5e, #e11d48);
      }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <h1 onclick="location.href = '/dashboard.html'">🎓 Student MS</h1>
      <div class="user-info">
        <span id="userName" style="color: #94a3b8"></span>
        <span class="role-badge">Student</span>
        <button class="logout-btn" onclick="logout()">Logout</button>
      </div>
    </nav>
    <div class="container">
      <div class="sidebar">
        <a href="/dashboard.html">📊 Dashboard</a>
        <div class="section">Academic</div>
        <a href="/courses.html">📚 Courses</a>
        <a href="/my-enrollments.html" class="active">📋 My Enrollments</a>
        <a href="/classmates.html">👥 Classmates</a>
        <div class="section">Account</div>
        <a href="/profile.html">👤 Profile</a>
      </div>
      <div class="main">
        <div class="page-header">
          <h2>📋 My Enrollments</h2>
          <p>Courses you are enrolled in</p>
        </div>
        <div class="card">
          <div class="card-header"><h3>Enrolled Courses</h3></div>
          <table>
            <thead>
              <tr>
                <th>Course Code</th>
                <th>Course Name</th>
                <th>Enrolled Date</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="dataTable"></tbody>
          </table>
        </div>
      </div>
    </div>
    <script>
      const token = localStorage.getItem("token");
      const user = JSON.parse(localStorage.getItem("user") || "null");
      if (!token || !user) location.href = "/login.html";

      document.getElementById("userName").textContent = user.username;

      async function api(url, method = "GET") {
        const res = await fetch(url, {
          method,
          headers: { Authorization: "Bearer " + token },
        });
        if (res.status === 401) {
          logout();
          return null;
        }
        if (!res.ok) return [];
        if (res.status === 204) return {};
        return res.json();
      }

      async function loadData() {
        const enrollments = (await api("/api/student/my-enrollments")) || [];
        document.getElementById("dataTable").innerHTML =
          enrollments
            .map(
              (e) => `
                <tr>
                    <td style="color:#00ffc8">${e.courseCode}</td>
                    <td>${e.courseName}</td>
                    <td style="color:#64748b">${e.enrolledDate || "-"}</td>
                    <td><span class="status-badge status-enrolled">${e.status}</span></td>
                    <td><button class="btn btn-danger btn-sm" onclick="dropCourse(${e.courseId})">Drop</button></td>
                </tr>
            `,
            )
            .join("") ||
          '<tr><td colspan="5" style="text-align:center;padding:40px;color:#64748b">No enrollments yet. <a href="/courses.html" style="color:#00ffc8">Browse courses</a></td></tr>';
      }

      async function dropCourse(courseId) {
        if (!confirm("Drop this course?")) return;
        await api("/api/student/drop/" + courseId, "DELETE");
        showToast("Course dropped");
        loadData();
      }

      function showToast(msg, type = "success") {
        const t = document.createElement("div");
        t.className = "toast " + type;
        t.textContent = msg;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 3000);
      }
      function logout() {
        localStorage.clear();
        location.href = "/login.html";
      }

      loadData();
    </script>
  </body>
</html>
