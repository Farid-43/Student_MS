<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile - Student MS</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Inter", "Segoe UI", sans-serif;
        background: #0f0f23;
        min-height: 100vh;
        color: #e2e8f0;
      }
      .navbar {
        background: linear-gradient(90deg, #1a1a3e 0%, #0d1b2a 100%);
        padding: 16px 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid rgba(0, 255, 200, 0.1);
      }
      .navbar h1 {
        font-size: 1.4em;
        background: linear-gradient(135deg, #00ffc8, #00b4d8);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        cursor: pointer;
      }
      .navbar .user-info {
        display: flex;
        align-items: center;
        gap: 15px;
      }
      .role-badge {
        padding: 6px 14px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
      }
      .role-admin {
        background: linear-gradient(135deg, #f43f5e, #e11d48);
        color: #fff;
      }
      .role-teacher {
        background: linear-gradient(135deg, #8b5cf6, #7c3aed);
        color: #fff;
      }
      .role-student {
        background: linear-gradient(135deg, #10b981, #059669);
        color: #fff;
      }
      .logout-btn {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: #fff;
        padding: 8px 18px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        transition: all 0.3s;
      }
      .logout-btn:hover {
        background: rgba(239, 68, 68, 0.2);
        border-color: #f43f5e;
      }
      .container {
        display: flex;
        min-height: calc(100vh - 65px);
      }
      .sidebar {
        width: 240px;
        background: #1a1a3e;
        padding: 25px 0;
        border-right: 1px solid rgba(0, 255, 200, 0.1);
      }
      .sidebar a {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 25px;
        color: #94a3b8;
        text-decoration: none;
        transition: all 0.3s;
        font-size: 14px;
      }
      .sidebar a:hover,
      .sidebar a.active {
        background: rgba(0, 255, 200, 0.05);
        color: #00ffc8;
        border-right: 3px solid #00ffc8;
      }
      .sidebar .section {
        padding: 20px 25px 10px;
        color: #475569;
        font-size: 11px;
        text-transform: uppercase;
        font-weight: 700;
        letter-spacing: 1px;
      }
      .main {
        flex: 1;
        padding: 30px;
        max-width: 800px;
      }
      .page-header {
        margin-bottom: 25px;
      }
      .page-header h2 {
        color: #00ffc8;
        font-size: 1.5em;
        margin-bottom: 5px;
      }
      .page-header p {
        color: #64748b;
      }
      .profile-header {
        display: flex;
        align-items: center;
        gap: 25px;
        margin-bottom: 30px;
        padding: 30px;
        background: linear-gradient(
          135deg,
          rgba(0, 255, 200, 0.05),
          rgba(0, 180, 216, 0.05)
        );
        border: 1px solid rgba(0, 255, 200, 0.1);
        border-radius: 16px;
      }
      .avatar {
        width: 100px;
        height: 100px;
        background: linear-gradient(135deg, #00ffc8, #00b4d8);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 40px;
        font-weight: 700;
        color: #0f0f23;
      }
      .profile-info h3 {
        color: #e2e8f0;
        font-size: 1.5em;
        margin-bottom: 8px;
      }
      .profile-info p {
        color: #64748b;
        margin-bottom: 8px;
      }
      .card {
        background: #1a1a3e;
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 16px;
        overflow: hidden;
        margin-bottom: 20px;
      }
      .card-header {
        padding: 20px 25px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }
      .card-header h3 {
        color: #e2e8f0;
      }
      .card-body {
        padding: 25px;
      }
      .form-group {
        margin-bottom: 20px;
      }
      .form-group label {
        display: block;
        color: #94a3b8;
        margin-bottom: 8px;
        font-weight: 600;
        font-size: 13px;
      }
      .form-group input {
        width: 100%;
        padding: 12px 16px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(0, 0, 0, 0.3);
        color: #e2e8f0;
        font-size: 14px;
      }
      .form-group input:focus {
        outline: none;
        border-color: #00ffc8;
        box-shadow: 0 0 0 3px rgba(0, 255, 200, 0.1);
      }
      .form-group input:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .btn {
        padding: 12px 24px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        font-size: 14px;
        transition: all 0.3s;
      }
      .btn-primary {
        background: linear-gradient(135deg, #00ffc8, #00b4d8);
        color: #0f0f23;
      }
      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(0, 255, 200, 0.3);
      }
      .info-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
      }
      .info-item {
        padding: 20px;
        background: rgba(0, 0, 0, 0.2);
        border-radius: 12px;
      }
      .info-item label {
        display: block;
        color: #64748b;
        font-size: 12px;
        text-transform: uppercase;
        margin-bottom: 6px;
      }
      .info-item span {
        color: #e2e8f0;
        font-weight: 600;
      }
      .toast {
        position: fixed;
        bottom: 20px;
        right: 20px;
        padding: 16px 24px;
        border-radius: 10px;
        color: #fff;
        font-weight: 600;
        z-index: 2000;
      }
      .toast.success {
        background: linear-gradient(135deg, #10b981, #059669);
      }
      .toast.error {
        background: linear-gradient(135deg, #f43f5e, #e11d48);
      }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <h1 onclick="location.href = '/dashboard.html'">🎓 Student MS</h1>
      <div class="user-info">
        <span id="userName" style="color: #94a3b8"></span>
        <span class="role-badge" id="roleBadge"></span>
        <button class="logout-btn" onclick="logout()">Logout</button>
      </div>
    </nav>
    <div class="container">
      <div class="sidebar" id="sidebar"></div>
      <div class="main">
        <div class="page-header">
          <h2>👤 Profile</h2>
          <p>Manage your account settings</p>
        </div>

        <div class="profile-header">
          <div class="avatar" id="avatar">A</div>
          <div class="profile-info">
            <h3 id="displayName">-</h3>
            <p id="displayEmail">-</p>
            <span class="role-badge" id="profileRole"></span>
          </div>
        </div>

        <div class="card">
          <div class="card-header"><h3>Account Information</h3></div>
          <div class="card-body">
            <div class="info-grid">
              <div class="info-item">
                <label>Username</label>
                <span id="infoUsername">-</span>
              </div>
              <div class="info-item">
                <label>Email</label>
                <span id="infoEmail">-</span>
              </div>
              <div class="info-item">
                <label>Role</label>
                <span id="infoRole">-</span>
              </div>
              <div class="info-item">
                <label>User ID</label>
                <span id="infoId">-</span>
              </div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-header"><h3>Change Password</h3></div>
          <div class="card-body">
            <form id="passwordForm">
              <div class="form-group">
                <label>Current Password</label>
                <input type="password" id="currentPassword" required />
              </div>
              <div class="form-group">
                <label>New Password</label>
                <input
                  type="password"
                  id="newPassword"
                  required
                  minlength="6"
                />
              </div>
              <div class="form-group">
                <label>Confirm New Password</label>
                <input type="password" id="confirmPassword" required />
              </div>
              <button type="submit" class="btn btn-primary">
                Update Password
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script>
      const token = localStorage.getItem("token");
      const user = JSON.parse(localStorage.getItem("user") || "null");
      if (!token || !user) location.href = "/login.html";

      const role = (user.roles || [])[0] || "";
      const isAdmin = role.includes("ADMIN");
      const isTeacher = role.includes("TEACHER");
      const isStudent = role.includes("STUDENT");
      const roleName = isAdmin ? "Admin" : isTeacher ? "Teacher" : "Student";
      const roleClass = isAdmin
        ? "role-admin"
        : isTeacher
          ? "role-teacher"
          : "role-student";

      document.getElementById("userName").textContent = user.username;
      const roleBadge = document.getElementById("roleBadge");
      roleBadge.textContent = roleName;
      roleBadge.classList.add(roleClass);

      // Avatar
      document.getElementById("avatar").textContent = (user.username || "U")
        .charAt(0)
        .toUpperCase();
      document.getElementById("displayName").textContent = user.username;
      document.getElementById("displayEmail").textContent = user.email || "-";
      const profileRole = document.getElementById("profileRole");
      profileRole.textContent = roleName;
      profileRole.classList.add(roleClass);

      // Info
      document.getElementById("infoUsername").textContent = user.username;
      document.getElementById("infoEmail").textContent = user.email || "-";
      document.getElementById("infoRole").textContent = roleName;
      document.getElementById("infoId").textContent = user.id || "-";

      // Sidebar
      let sidebar = '<a href="/dashboard.html">📊 Dashboard</a>';
      if (isAdmin) {
        sidebar +=
          '<div class="section">Management</div><a href="/students.html">👨‍🎓 Students</a><a href="/teachers.html">👨‍🏫 Teachers</a><a href="/courses.html">📚 Courses</a><a href="/departments.html">🏛️ Departments</a><a href="/users.html">👥 Users</a>';
      } else if (isTeacher) {
        sidebar +=
          '<div class="section">Teaching</div><a href="/students.html">👨‍🎓 Students</a><a href="/courses.html">📚 Courses</a><a href="/departments.html">🏛️ Departments</a>';
      } else {
        sidebar +=
          '<div class="section">Academic</div><a href="/courses.html">📚 Courses</a><a href="/my-enrollments.html">📋 My Enrollments</a><a href="/classmates.html">👥 Classmates</a>';
      }
      sidebar +=
        '<div class="section">Account</div><a href="/profile.html" class="active">👤 Profile</a>';
      document.getElementById("sidebar").innerHTML = sidebar;

      document.getElementById("passwordForm").onsubmit = async (e) => {
        e.preventDefault();
        const newPwd = document.getElementById("newPassword").value;
        const confirmPwd = document.getElementById("confirmPassword").value;

        if (newPwd !== confirmPwd) {
          showToast("Passwords do not match", "error");
          return;
        }

        // Note: Password change endpoint would need to be implemented
        showToast("Password change feature requires backend implementation");
      };

      function showToast(msg, type = "success") {
        const t = document.createElement("div");
        t.className = "toast " + type;
        t.textContent = msg;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 3000);
      }
      function logout() {
        localStorage.clear();
        location.href = "/login.html";
      }
    </script>
  </body>
</html>
