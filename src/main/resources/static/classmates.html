<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Classmates - Student MS</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Inter", "Segoe UI", sans-serif;
        background: #0f0f23;
        min-height: 100vh;
        color: #e2e8f0;
      }
      .navbar {
        background: linear-gradient(90deg, #1a1a3e 0%, #0d1b2a 100%);
        padding: 16px 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid rgba(0, 255, 200, 0.1);
      }
      .navbar h1 {
        font-size: 1.4em;
        background: linear-gradient(135deg, #00ffc8, #00b4d8);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        cursor: pointer;
      }
      .navbar .user-info {
        display: flex;
        align-items: center;
        gap: 15px;
      }
      .role-badge {
        padding: 6px 14px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        background: linear-gradient(135deg, #10b981, #059669);
        color: #fff;
      }
      .logout-btn {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: #fff;
        padding: 8px 18px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        transition: all 0.3s;
      }
      .logout-btn:hover {
        background: rgba(239, 68, 68, 0.2);
        border-color: #f43f5e;
      }
      .container {
        display: flex;
        min-height: calc(100vh - 65px);
      }
      .sidebar {
        width: 240px;
        background: #1a1a3e;
        padding: 25px 0;
        border-right: 1px solid rgba(0, 255, 200, 0.1);
      }
      .sidebar a {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 25px;
        color: #94a3b8;
        text-decoration: none;
        transition: all 0.3s;
        font-size: 14px;
      }
      .sidebar a:hover,
      .sidebar a.active {
        background: rgba(0, 255, 200, 0.05);
        color: #00ffc8;
        border-right: 3px solid #00ffc8;
      }
      .sidebar .section {
        padding: 20px 25px 10px;
        color: #475569;
        font-size: 11px;
        text-transform: uppercase;
        font-weight: 700;
        letter-spacing: 1px;
      }
      .main {
        flex: 1;
        padding: 30px;
      }
      .page-header {
        margin-bottom: 25px;
      }
      .page-header h2 {
        color: #00ffc8;
        font-size: 1.5em;
        margin-bottom: 5px;
      }
      .page-header p {
        color: #64748b;
      }
      .dept-info {
        background: linear-gradient(
          135deg,
          rgba(0, 255, 200, 0.1),
          rgba(0, 180, 216, 0.1)
        );
        border: 1px solid rgba(0, 255, 200, 0.2);
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 25px;
        display: flex;
        align-items: center;
        gap: 15px;
      }
      .dept-icon {
        width: 50px;
        height: 50px;
        background: linear-gradient(135deg, #00ffc8, #00b4d8);
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
      }
      .dept-info h4 {
        color: #00ffc8;
        margin-bottom: 4px;
      }
      .dept-info p {
        color: #94a3b8;
        font-size: 14px;
      }
      .card {
        background: #1a1a3e;
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 16px;
        overflow: hidden;
      }
      .card-header {
        padding: 20px 25px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .card-header h3 {
        color: #e2e8f0;
      }
      .count-badge {
        background: rgba(0, 255, 200, 0.2);
        color: #00ffc8;
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 13px;
        font-weight: 600;
      }
      .classmates-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 20px;
        padding: 25px;
      }
      .classmate-card {
        background: rgba(0, 0, 0, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 12px;
        padding: 20px;
        transition: all 0.3s;
      }
      .classmate-card:hover {
        border-color: rgba(0, 255, 200, 0.3);
        transform: translateY(-2px);
      }
      .classmate-avatar {
        width: 60px;
        height: 60px;
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        font-weight: 700;
        color: #fff;
        margin-bottom: 15px;
      }
      .classmate-name {
        color: #e2e8f0;
        font-weight: 600;
        margin-bottom: 6px;
      }
      .classmate-id {
        color: #00ffc8;
        font-size: 13px;
        margin-bottom: 10px;
      }
      .classmate-info {
        display: flex;
        gap: 15px;
        font-size: 13px;
        color: #64748b;
      }
      .empty-state {
        text-align: center;
        padding: 60px 20px;
        color: #64748b;
      }
      .empty-state .icon {
        font-size: 48px;
        margin-bottom: 15px;
      }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <h1 onclick="location.href = '/dashboard.html'">🎓 Student MS</h1>
      <div class="user-info">
        <span id="userName" style="color: #94a3b8"></span>
        <span class="role-badge">Student</span>
        <button class="logout-btn" onclick="logout()">Logout</button>
      </div>
    </nav>
    <div class="container">
      <div class="sidebar">
        <a href="/dashboard.html">📊 Dashboard</a>
        <div class="section">Academic</div>
        <a href="/courses.html">📚 Courses</a>
        <a href="/my-enrollments.html">📋 My Enrollments</a>
        <a href="/classmates.html" class="active">👥 Classmates</a>
        <div class="section">Account</div>
        <a href="/profile.html">👤 Profile</a>
      </div>
      <div class="main">
        <div class="page-header">
          <h2>👥 Classmates</h2>
          <p>Students in your department</p>
        </div>
        <div class="dept-info" id="deptInfo" style="display: none">
          <div class="dept-icon">🏛️</div>
          <div>
            <h4 id="deptName">-</h4>
            <p id="deptDesc">Your department</p>
          </div>
        </div>
        <div class="card">
          <div class="card-header">
            <h3>Department Students</h3>
            <span class="count-badge" id="countBadge">0 students</span>
          </div>
          <div class="classmates-grid" id="classmatesGrid"></div>
        </div>
      </div>
    </div>
    <script>
      const token = localStorage.getItem("token");
      const user = JSON.parse(localStorage.getItem("user") || "null");
      if (!token || !user) location.href = "/login.html";

      document.getElementById("userName").textContent = user.username;

      async function api(url) {
        const res = await fetch(url, {
          headers: { Authorization: "Bearer " + token },
        });
        if (res.status === 401) {
          logout();
          return null;
        }
        if (!res.ok) return [];
        return res.json();
      }

      async function loadData() {
        const classmates =
          (await api("/api/student/department-students")) || [];
        const grid = document.getElementById("classmatesGrid");
        document.getElementById("countBadge").textContent =
          classmates.length + " students";

        if (classmates.length > 0 && classmates[0].department) {
          document.getElementById("deptInfo").style.display = "flex";
          document.getElementById("deptName").textContent =
            classmates[0].department;
        }

        if (classmates.length === 0) {
          grid.innerHTML = `<div class="empty-state" style="grid-column: 1/-1">
                    <div class="icon">👥</div>
                    <p>No classmates found in your department</p>
                </div>`;
          return;
        }

        grid.innerHTML = classmates
          .map(
            (s) => `
                <div class="classmate-card">
                    <div class="classmate-avatar">${(s.firstName || "S").charAt(0)}</div>
                    <div class="classmate-name">${s.firstName || ""} ${s.lastName || ""}</div>
                    <div class="classmate-id">${s.studentId || "-"}</div>
                    <div class="classmate-info">
                        <span>📧 ${s.email || "-"}</span>
                    </div>
                </div>
            `,
          )
          .join("");
      }

      function logout() {
        localStorage.clear();
        location.href = "/login.html";
      }

      loadData();
    </script>
  </body>
</html>
