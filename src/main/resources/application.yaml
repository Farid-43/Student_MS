spring:
  application:
    name: StudentMS

  datasource:
    url: jdbc:postgresql://localhost:5432/studentms
    username: studentms
    password: secret
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true

# JWT Configuration
jwt:
  secret: mySecretKeyForJWTTokenGenerationStudentMS2024SecureKey
  expiration: 86400000

server:
  port: 9090

