databaseChangeLog:
  - changeSet:
      id: 010-create-enrollments-table
      author: system
      changes:
        - createTable:
            tableName: enrollments
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: student_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: course_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: enrolled_date
                  type: DATE
              - column:
                  name: status
                  type: VARCHAR(20)
        - addForeignKeyConstraint:
            baseTableName: enrollments
            baseColumnNames: student_id
            referencedTableName: students
            referencedColumnNames: id
            constraintName: fk_enrollment_student
        - addForeignKeyConstraint:
            baseTableName: enrollments
            baseColumnNames: course_id
            referencedTableName: courses
            referencedColumnNames: id
            constraintName: fk_enrollment_course
        - addUniqueConstraint:
            tableName: enrollments
            columnNames: student_id, course_id
            constraintName: uk_student_course
