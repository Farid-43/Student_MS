databaseChangeLog:
  - changeSet:
      id: 004-create-students-table
      author: system
      changes:
        - createTable:
            tableName: students
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: student_id
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: department
                  type: VARCHAR(100)
              - column:
                  name: semester
                  type: INT
              - column:
                  name: enrollment_date
                  type: DATE
              - column:
                  name: gpa
                  type: DECIMAL(3, 2)
        - addForeignKeyConstraint:
            baseTableName: students
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_students_user
            onDelete: CASCADE
