databaseChangeLog:
  - changeSet:
      id: 005-create-teachers-table
      author: system
      changes:
        - createTable:
            tableName: teachers
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: employee_id
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: department
                  type: VARCHAR(100)
              - column:
                  name: designation
                  type: VARCHAR(50)
              - column:
                  name: joining_date
                  type: DATE
        - addForeignKeyConstraint:
            baseTableName: teachers
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_teachers_user
            onDelete: CASCADE
