spring:
  application:
    name: StudentMS-Test

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
    database-platform: org.hibernate.dialect.H2Dialect

  liquibase:
    enabled: false

  docker:
    compose:
      enabled: false

jwt:
  secret: testSecretKeyForJWTTokenGenerationStudentMS2024SecureKeyTestKey123456
  expiration: 86400000

server:
  port: 0
