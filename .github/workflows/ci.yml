# GitHub Actions CI/CD Pipeline for Student Management System
# This workflow runs on every push and pull request to main/develop branches

name: CI Pipeline

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]

jobs:
    build-and-test:
        name: Build & Test
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_DB: testdb
                    POSTGRES_USER: testuser
                    POSTGRES_PASSWORD: testpass
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            # 1. Checkout the repository code
            - name: Checkout code
              uses: actions/checkout@v4

            # 2. Set up Java 21 (required by Spring Boot 4.x)
            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  java-version: "21"
                  distribution: "temurin"
                  cache: maven

            # 3. Cache Maven dependencies for faster builds
            - name: Cache Maven packages
              uses: actions/cache@v4
              with:
                  path: ~/.m2/repository
                  key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
                  restore-keys: |
                      ${{ runner.os }}-maven-

            # 4. Build the project (compile only, skip tests for now)
            - name: Build with Maven
              run: ./mvnw compile -B

            # 5. Run all unit tests and integration tests
            - name: Run Tests
              run: ./mvnw test -B
              env:
                  SPRING_PROFILES_ACTIVE: test

            # 6. Upload test results as artifact (for debugging failed tests)
            - name: Upload Test Results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: test-results
                  path: target/surefire-reports/

    # Code quality checks
    code-quality:
        name: Code Quality
        runs-on: ubuntu-latest
        needs: build-and-test

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  java-version: "21"
                  distribution: "temurin"
                  cache: maven

            # Package the application (verify it builds successfully)
            - name: Package Application
              run: ./mvnw package -DskipTests -B

            # Upload the built JAR as artifact
            - name: Upload JAR artifact
              uses: actions/upload-artifact@v4
              with:
                  name: app-jar
                  path: target/*.jar
