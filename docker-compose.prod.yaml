# Docker Compose for production with app container
services:
  postgres:
    image: 'postgres:16'
    container_name: studentms-db
    environment:
      - 'POSTGRES_DB=studentms'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=studentms'
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studentms"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - studentms-network

  app:
    build: .
    container_name: studentms-app
    ports:
      - '8080:8080'
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/studentms
      - SPRING_DATASOURCE_USERNAME=studentms
      - SPRING_DATASOURCE_PASSWORD=secret
      - JWT_SECRET=mySecretKeyForJWTTokenGenerationStudentMS2024SecureKey
      - JWT_EXPIRATION=86400000
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - studentms-network

volumes:
  postgres_data:

networks:
  studentms-network:
    driver: bridge
